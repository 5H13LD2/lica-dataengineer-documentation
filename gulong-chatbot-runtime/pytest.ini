[pytest]
addopts = -m "not integration"
markers =
    integration: tests that call live external services (opt-in)
filterwarnings =
    ignore:datetime\.datetime\.utcfromtimestamp\(\) is deprecated:DeprecationWarning:google\.protobuf
    ignore:enable_cleanup_closed ignored because .*:DeprecationWarning:aiohttp\.connector
    ignore:Pydantic serializer warnings:UserWarning:pydantic\.main
    ignore:coroutine 'Logging\.async_success_handler' was never awaited:RuntimeWarning:litellm\.litellm_core_utils\.logging_worker
    ignore:coroutine 'close_litellm_async_clients' was never awaited:RuntimeWarning:litellm\.llms\.custom_httpx\.async_client_cleanup
    ignore:PydanticSerializationUnexpectedValue:UserWarning:pydantic\.main
    ignore:coroutine 'close_litellm_async_clients' was never awaited:RuntimeWarning
